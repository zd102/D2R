name: Server CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run package:server
      - run: npm run test:package
        timeout-minutes: 5
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DPackageDir=$pwd\release\package" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Test Windows install, upgrade and uninstall
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/assets/*-setup.exe).FullName
          foreach ($iteration in 1..2) {
            $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
            if ((Get-Service D2RServer).StartType -ne 'Automatic') { throw 'Service is not automatic' }
            $env:INSTALLED_URL = 'http://127.0.0.1:5173'
            npm run test:package
            if ($LASTEXITCODE -ne 0) { throw 'Installed server smoke failed' }
            if ($iteration -eq 1) { Add-Content "$env:ProgramData/D2RServer/server.env" '# upgrade-preservation-marker' }
          }
          if (-not (Select-String -Path "$env:ProgramData/D2RServer/server.env" -Pattern 'upgrade-preservation-marker')) { throw 'Upgrade lost configuration' }
          $process = Start-Process -FilePath "$env:ProgramFiles/D2R Server/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Get-Service D2RServer -ErrorAction SilentlyContinue) { throw 'Service still installed' }
          if (-not (Test-Path "$env:ProgramData/D2RServer/data/online.sqlite")) { throw 'Uninstall removed persistent data' }
      - name: Test Linux install and upgrade
        timeout-minutes: 10
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo bash release/package/install.sh
          INSTALLED_URL=http://127.0.0.1:5173 npm run test:package
          echo '# upgrade-preservation-marker' | sudo tee -a /etc/d2r-server/server.env
          sudo bash release/package/install.sh
          sudo grep -q upgrade-preservation-marker /etc/d2r-server/server.env
          systemctl is-enabled d2r-server
          INSTALLED_URL=http://127.0.0.1:5173 npm run test:package
          sudo systemctl disable --now d2r-server
          sudo test -f /var/lib/d2r-server/online.sqlite
      - name: Archive Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release/assets
          tar -czf "release/assets/D2R-Server-$version-linux-x64.tar.gz" -C release/package .
      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}
          path: release/assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: release/assets
          merge-multiple: true
      - name: Publish server release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cp docs/server-release.md release/assets/SERVER-INSTALL.md
          (cd release/assets && sha256sum *.exe *.tar.gz SERVER-INSTALL.md > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Never replace the assets of an already published release.
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "D2R Server $RELEASE_TAG" --notes-file docs/server-release.md
          fi
          gh release upload "$RELEASE_TAG" release/assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
